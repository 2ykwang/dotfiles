onboarding = false
[keys]
prefix = "ctrl+a"

# prefix+alt+g -> lazygit in a modal popup
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

# The per-user launcher keeps project locations out of shared configuration.
[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-finder.open"
description = "Find a running session"

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

status_indicators = "symbols"

[ui.sidebar.agents]
row_gap = 0
rows = [
    [
        "state_icon",
        { token = "workspace", bold = true, dim = false },
    ],
    [
        { token = "tab", fg = "#ABB2BF", bold = true, dim = false },
        # Manual pane name. Empty for unnamed panes, so only named panes
        # (for example ones an agent opened and marked) show it.
        { token = "pane", fg = "#EBCB8B", bold = true, dim = false },
        { token = "agent", fg = "#ABB2BF", bold = true, dim = false },
    ],
    [
        { token = "$sidebar_last_active", fg = "#808080", bold = false, dim = false },
    ],
]

[ui.toast]
delivery = "system"

# Resume Claude/Codex panes into their native sessions after a restart.
# Relies on the per-agent integration hook (herdr integration install <agent>).
[session]
resume_agents_on_restore = true

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true
# Show the cursor in agent panes while a CJK (Korean) IME is composing.
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude"]

[theme]
name = "nord"
auto_switch = false
