default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # 기본 검사
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^zed/  # Zed settings are JSONC (comments, trailing commas)
      - id: check-added-large-files
      - id: check-symlinks
      - id: detect-private-key

  # 셸 스크립트 검사 (Brewfile로 설치된 shellcheck 사용)
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck -x
        language: system
        types: [shell]
        files: (\.sh|\.zsh|\.zshrc)$

  # Uses the Brewfile's gitleaks binary. It picks up .gitleaks.toml from the
  # repo root and reads the staged diff itself, so it takes no filenames.
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --staged --redact --verbose --no-banner
        language: system
        pass_filenames: false

  # The commit stage only sees changed files, so recheck every shell script
  # and the commits being pushed. This also catches --no-verify commits.
  - repo: local
    hooks:
      - id: shellcheck-all
        name: shellcheck (all files)
        entry: pre-commit run shellcheck --all-files
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # Pushing from the root commit leaves FROM_REF empty, so this scans the
      # full history.
      - id: gitleaks-push
        name: gitleaks (push range)
        entry: bash -c 'gitleaks git --log-opts="${PRE_COMMIT_FROM_REF:+$PRE_COMMIT_FROM_REF..}$PRE_COMMIT_TO_REF" --redact --verbose --no-banner'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
